name: 'Setup Go Environment'
description: 'Setup Go (version read from go.mod) with module and build caching'
inputs:
  cache-dependency-path:
    description: 'Path to go.sum for cache key'
    required: false
    default: 'go.sum'

runs:
  using: 'composite'
  steps:
  - name: Setup Go
    uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
    with:
      go-version-file: go.mod
      cache: true
      cache-dependency-path: ${{ inputs.cache-dependency-path }}

  - name: Display Go version
    shell: bash
    run: go version
